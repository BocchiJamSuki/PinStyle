# Conda env for PinStyle (demo scope): Python 3.11 + pinned pip packages.
# Exact transitive pins are frozen into requirements.lock.txt after D0.
# On the AutoDL server use scripts/remote/setup_env.sh (mirrors + academic acceleration).
name: pinstyle
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - -r requirements.txt
      - -e .
