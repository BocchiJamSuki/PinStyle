# Demo model set (ADR-0006, THIRD_PARTY §0). Revisions are pinned by download_models.py
# into models/MANIFEST.json (the resolved commit SHA of each repo at download time).
paths:
  models: models
  runs: runs

models:
  sdxl:
    repo: stabilityai/stable-diffusion-xl-base-1.0
    revision: 462165984030d82259a11f4367a4eed129e94a7b  # = server download 2026-10-07
    modelscope: AI-ModelScope/stable-diffusion-xl-base-1.0
    allow: ["model_index.json", "scheduler/*", "tokenizer/*", "tokenizer_2/*",
            "text_encoder/config.json", "text_encoder/model.fp16.safetensors",
            "text_encoder_2/config.json", "text_encoder_2/model.fp16.safetensors",
            "unet/config.json", "unet/diffusion_pytorch_model.fp16.safetensors"]
  vae:
    repo: madebyollin/sdxl-vae-fp16-fix
    revision: 207b116dae70ace3637169f1ddd2434b91b3a8cd  # = server download 2026-10-07
    modelscope: AI-ModelScope/sdxl-vae-fp16-fix
    allow: ["config.json", "diffusion_pytorch_model.safetensors"]
  controlnet_lineart:
    repo: TheMistoAI/MistoLine
    revision: 1d9d0b3d48b295cf70d80a0f839a3055672f8393  # = server download 2026-10-07
    allow: ["config.json", "diffusion_pytorch_model.fp16.safetensors"]
  ip_adapter:
    repo: h94/IP-Adapter
    revision: 018e402774aeeddd60609b4ecdb7e298259dc729  # = server download 2026-10-07
    modelscope: AI-ModelScope/IP-Adapter
    allow: ["sdxl_models/ip-adapter-plus_sdxl_vit-h.safetensors",
            "models/image_encoder/config.json", "models/image_encoder/model.safetensors"]
  sam2:
    repo: facebook/sam2.1-hiera-large
    revision: 665f8e2ad61cf5f53d65644ff27c8ee525124610  # = server download 2026-10-07
    modelscope: facebook/sam2.1-hiera-large
    allow: ["config.json", "model.safetensors", "preprocessor_config.json", "processor_config.json"]
  dinov2:
    repo: facebook/dinov2-with-registers-large
    revision: e4c89a4e05589de9b3e188688a303d0f3c04d0f3  # = server download 2026-10-07
    modelscope: facebook/dinov2-with-registers-large
    allow: ["config.json", "model.safetensors", "preprocessor_config.json"]
