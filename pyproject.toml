[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinstyle"
version = "0.1.0"
description = "PinStyle demo: region-controllable style finishing with point pairs"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu and not slow and not network' --disable-socket --allow-unix-socket"
markers = [
    "gpu: needs the CUDA GPU",
    "slow: slow test",
    "network: needs network access",
]
